name: Publish

# Push a tag like v1.1.0 to publish @agenttax/mcp-server to npm and list it in
# the official MCP Registry (registry.modelcontextprotocol.io).
# No secrets. npm publishes through trusted publishing (OIDC): the package's
# npm settings trust AgentTax/agenttax-mcp publish.yml, and token publishing is
# disabled on the package. The MCP Registry login uses the same GitHub OIDC
# token, which proves ownership of the io.github.AgentTax namespace.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # No registry-url: it writes an .npmrc with a placeholder auth token
          # that npm sends instead of doing the OIDC exchange (404 on publish).

      # Trusted publishing needs npm 11.5.1+. npm@latest (12.x) needs Node 22+,
      # so pin the major.
      - run: npm install -g npm@11

      - run: npm ci

      - name: Versions agree (tag, package.json, server.json)
        run: |
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          SRVPKG=$(node -p "require('./server.json').packages[0].version")
          NAME=$(node -p "require('./package.json').mcpName")
          SRVNAME=$(node -p "require('./server.json').name")
          echo "package=$PKG server=$SRV server.packages=$SRVPKG"
          test "$PKG" = "$SRV" && test "$PKG" = "$SRVPKG" && test "$NAME" = "$SRVNAME"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then test "${GITHUB_REF_NAME}" = "v$PKG"; fi

      - name: Server starts and lists its tools
        run: |
          node --check index.js
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 10 node index.js | tee /tmp/out.jsonl
          grep -q '"get_nexus_thresholds"' /tmp/out.jsonl

      - name: Publish to npm
        run: |
          PKG=$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")
          if npm view "$PKG" version >/dev/null 2>&1; then
            echo "$PKG is already on npm; skipping publish."
          else
            npm publish --access public
          fi

      - name: Publish to the MCP Registry
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          # npm can take a few minutes to serve a new version, and the registry
          # validates against npm, so wait for it and retry.
          PKG=$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")
          for i in $(seq 1 20); do npm view "$PKG" version >/dev/null 2>&1 && break; sleep 15; done
          for i in 1 2 3 4 5; do ./mcp-publisher publish && exit 0; sleep 30; done
          exit 1
